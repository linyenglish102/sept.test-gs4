    <style>
        body {

            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
            background-color: #f8f9fa;
        }
        input[type="text"], textarea {
            -webkit-user-select: text;
            -moz-user-select: text;
            -ms-user-select: text;

                    <label class="block text-[#1f2937] font-bold mb-2">Họ và tên học sinh <span class="text-red-500">*</span></label>

                </div>

                        <p id="timer" class="text-2xl font-bold text-red-600 font-mono">45:00</p>
                    </div>
                </div>
            </div>
        </div>

        <!-- Khung chứa câu hỏi -->
        <div id="quiz-container" class="space-y-6">
            <!-- Render bằng JavaScript -->
        </div>

        <!-- Nút hành động -->
        <div class="mt-8 flex justify-center gap-4">
            <button id="submit-btn" class="bg-[#2563eb] hover:bg-[#1d4ed8] text-white font-bold py-3 px-8 rounded-lg shadow-md transition duration-200 text-lg cursor-pointer">
                NỘP BÀI VÀ XEM KẾT QUẢ
            </button>
            <button id="retry-btn" class="hidden bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3 px-8 rounded-lg shadow-md transition duration-200 text-lg cursor-pointer">
                LÀM LẠI BÀI THI
            </button>
        </div>
    </div>

            <p id="modal-name" class="text-gray-700 font-medium mb-4 text-lg"></p>
            
            <div class="bg-gray-50 border border-gray-200 rounded-lg p-4 mb-4">

                <span class="text-red-600 bg-red-50 px-3 py-1 rounded">Số câu sai: <span id="modal-wrong">0</span> / 50</span>
            </div>

                XEM ĐÁP ÁN CHI TIẾT
            </button>
        </div>
    </div>

            { id: 46, section: "PHẦN 5: KĨ NĂNG VIẾT VÀ BÀI TẬP DANH TỪ", subHeader: "Bài 9: Cho dạng đúng của danh từ số ít hoặc số nhiều trong ngoặc", type: "text", q: "My sister buys two new _________ (watch) at the shop.", ans: "watches", explain: "Tận cùng '-ch' -> thêm '-es'." },
            { id: 47, section: "PHẦN 5: KĨ NĂNG VIẾT VÀ BÀI TẬP DANH TỪ", type: "text", q: "There are four _________ (box) of milk on the table.", ans: "boxes", explain: "Tận cùng '-x' -> thêm '-es'." },
            { id: 48, section: "PHẦN 5: KĨ NĂNG VIẾT VÀ BÀI TẬP DANH TỪ", type: "text", q: "The farmer has ten _________ (sheep) on his farm.", ans: "sheep", explain: "Danh từ bất quy tắc số nhiều giữ nguyên 'sheep'." },
            { id: 49, section: "PHẦN 5: KĨ NĂNG VIẾT VÀ BÀI TẬP DANH TỪ", type: "text", q: "Look! Three _________ (mouse) are running under the bed.", ans: "mice", explain: "Số nhiều bất quy tắc của 'mouse' là 'mice'." },
            { id: 50, section: "PHẦN 5: KĨ NĂNG VIẾT VÀ BÀI TẬP DANH TỪ", type: "text", q: "Be careful with those _________ (knife) on the counter.", ans: "knives", explain: "Tận cùng '-fe' đổi thành '-ves'." }
        ];

        const STORAGE_KEY = "english_exam_grade4_v45m";
        let timeRemaining = 45 * 60; // 45 phút = 2700s
        let timerInterval = null;
        let isSubmitted = false;

        document.addEventListener('DOMContentLoaded', () => {
            initAntiCopy();
            renderUI();
            loadState();
            
            if (!isSubmitted) {
                startTimer();
            } else {
                restoreSubmittedUI();
            }

            document.getElementById('submit-btn').addEventListener('click', () => submitExam(false));
            document.getElementById('retry-btn').addEventListener('click', retryExam);
            document.getElementById('close-modal-btn').addEventListener('click', closeModal);
            document.getElementById('student-name').addEventListener('input', saveState);
        });

        function initAntiCopy() {
            document.addEventListener('contextmenu', e => e.preventDefault());
            document.addEventListener('copy', e => e.preventDefault());
            document.addEventListener('cut', e => e.preventDefault());
            document.addEventListener('dragstart', e => e.preventDefault());
            document.addEventListener('keydown', e => {
                if ((e.ctrlKey || e.metaKey) && ['c', 'u', 's', 'a', 'p'].includes(e.key.toLowerCase())) {
                    e.preventDefault();
                }
                if (e.key === 'F12') e.preventDefault();
            });
        }

        function renderUI() {
            const container = document.getElementById('quiz-container');
            let currentSection = '';
            let currentSubHeader = '';

            questionsData.forEach(item => {
                if (item.section !== currentSection) {
                    currentSection = item.section;
                    const sectionTitle = document.createElement('h2');
                    sectionTitle.className = "text-xl font-bold text-[#1e3a8a] mt-10 mb-2 border-b-2 border-blue-200 pb-2 uppercase";
                    sectionTitle.innerText = currentSection;
                    container.appendChild(sectionTitle);
                    currentSubHeader = ''; 
                }

                if (item.subHeader && item.subHeader !== currentSubHeader) {
                    currentSubHeader = item.subHeader;
                    const subTitle = document.createElement('div');
                    subTitle.className = "text-lg font-bold text-gray-700 mt-6 mb-3";
                    subTitle.innerHTML = currentSubHeader;
                    container.appendChild(subTitle);
                }

                const card = document.createElement('div');
                card.className = "bg-white p-5 rounded-lg border border-gray-200 shadow-sm";
                card.id = `question-card-${item.id}`;

                let htmlContent = `<p class="font-bold text-gray-800 mb-3 text-base">Câu ${item.id}. ${item.q}</p>`;

                if (item.type === 'mcq') {
                    htmlContent += `<div class="grid grid-cols-1 sm:grid-cols-2 gap-3">`;
                    item.options.forEach(opt => {
                        const val = opt.charAt(0);
                        htmlContent += `
                            <label class="flex items-center p-3 border border-gray-200 rounded-md cursor-pointer hover:bg-blue-50 transition">
                                <input type="radio" name="q${item.id}" value="${val}" class="w-4 h-4 text-[#2563eb] mr-3">
                                <span>${opt}</span>
                            </label>
                        `;
                    });
                    htmlContent += `</div>`;
                } else {
                    htmlContent += `<input type="text" id="q${item.id}" placeholder="Nhập câu trả lời..." class="w-full px-4 py-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-[#2563eb] outline-none text-base">`;
                }

                htmlContent += `
                    <div id="feedback-${item.id}" class="hidden mt-4 pt-3 border-t border-gray-100 text-sm">
                        <p class="mb-1"><span class="font-bold text-gray-700">Trạng thái:</span> <span id="status-${item.id}"></span></p>
                        <p class="mb-1"><span class="font-bold text-gray-700">Đáp án đúng:</span> <span class="text-[#2563eb] font-bold">${item.ans}</span></p>
                        <p><span class="font-bold text-gray-700">Giải thích:</span> ${item.explain}</p>
                    </div>
                `;

                card.innerHTML = htmlContent;
                container.appendChild(card);
            });

            document.querySelectorAll('input[type="radio"]').forEach(radio => {
                radio.addEventListener('change', saveState);
            });
            document.querySelectorAll('input[type="text"]').forEach(input => {
                input.addEventListener('input', saveState);
            });
        }

        function saveState() {
            if (isSubmitted) return;
            try {
                const answers = {};
                questionsData.forEach(q => {
                    if (q.type === 'mcq') {
                        const checked = document.querySelector(`input[name="q${q.id}"]:checked`);
                        if (checked) answers[q.id] = checked.value;
                    } else {
                        const el = document.getElementById(`q${q.id}`);
                        if (el) answers[q.id] = el.value;
                    }
                });

                const nameInput = document.getElementById('student-name');
                const state = {
                    time: timeRemaining,
                    name: nameInput ? nameInput.value : '',
                    answers: answers,
                    submitted: isSubmitted
                };
                localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
            } catch (e) {
                console.warn("Không thể lưu LocalStorage:", e);
            }
        }

        function loadState() {
            try {
                const saved = localStorage.getItem(STORAGE_KEY);
                if (saved) {
                    const state = JSON.parse(saved);
                    const nameInput = document.getElementById('student-name');
                    if (nameInput) nameInput.value = state.name || '';
                    if (typeof state.time === 'number') timeRemaining = state.time;
                    isSubmitted = !!state.submitted;

                    if (state.answers) {
                        questionsData.forEach(q => {
                            const val = state.answers[q.id];
                            if (val !== undefined) {
                                if (q.type === 'mcq') {
                                    const radio = document.querySelector(`input[name="q${q.id}"][value="${val}"]`);
                                    if (radio) radio.checked = true;
                                } else {
                                    const el = document.getElementById(`q${q.id}`);
                                    if (el) el.value = val;
                                }
                            }
                        });
                    }
                }
            } catch (e) {
                console.warn("Không thể tải LocalStorage:", e);
            }
        }

        function startTimer() {
            updateTimerUI();
            timerInterval = setInterval(() => {
                timeRemaining--;
                saveState();
                updateTimerUI();

                if (timeRemaining <= 0) {
                    clearInterval(timerInterval);
                    alert("Đã hết 45 phút! Hệ thống tự động nộp bài.");
                    submitExam(true);
                }
            }, 1000);
        }

        function updateTimerUI() {
            const m = Math.floor(Math.max(0, timeRemaining) / 60);
            const s = Math.max(0, timeRemaining) % 60;
            const timerEl = document.getElementById('timer');
            if (timerEl) {
                timerEl.innerText = `${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
            }
        }

        function cleanText(txt) {
            if (!txt) return "";
            return txt.toLowerCase()
                      .replace(/[.,?!]+$/, "")
                      .replace(/\s+/g, " ")
                      .trim();
        }

        function submitExam(autoSubmit = false) {
            const nameEl = document.getElementById('student-name');
            let studentName = nameEl ? nameEl.value.trim() : "";

            if (!studentName && !autoSubmit) {
                studentName = "Học sinh";
                if (nameEl) nameEl.value = studentName;
            }

            // KIỂM TRA ĐÃ LÀM HẾT TẤT CẢ CÁC CÂU CHƯA
            let unanswered = [];
            questionsData.forEach(q => {
                if (q.type === 'mcq') {
                    const checked = document.querySelector(`input[name="q${q.id}"]:checked`);
                    if (!checked) unanswered.push(q.id);
                } else {
                    const inputEl = document.getElementById(`q${q.id}`);
                    if (!inputEl || !inputEl.value.trim()) unanswered.push(q.id);
                }
            });

            if (unanswered.length > 0 && !autoSubmit) {
                alert(`Bạn chưa hoàn thành tất cả các câu hỏi!\nCòn thiếu ${unanswered.length} câu chưa làm: Câu ${unanswered.join(', ')}.\nVui lòng làm hết tất cả các câu trước khi nộp bài!`);
                const firstUnansweredCard = document.getElementById(`question-card-${unanswered[0]}`);
                if (firstUnansweredCard) {
                    firstUnansweredCard.scrollIntoView({ behavior: 'smooth', block: 'center' });
                }
                return;
            }

            if (!autoSubmit && !confirm("Bạn có chắc chắn muốn nộp bài?")) return;

            if (timerInterval) clearInterval(timerInterval);
            isSubmitted = true;
            saveState();

            let correctCount = 0;
            let wrongQuestions = [];

            questionsData.forEach(q => {
                let isCorrect = false;
                let userAns = "";

                if (q.type === 'mcq') {
                    const checked = document.querySelector(`input[name="q${q.id}"]:checked`);
                    userAns = checked ? checked.value : "";
                    if (userAns === q.ans) isCorrect = true;
                } else {
                    const inputEl = document.getElementById(`q${q.id}`);
                    userAns = inputEl ? inputEl.value : "";
                    if (cleanText(userAns) === cleanText(q.ans)) isCorrect = true;
                }

                const feedbackEl = document.getElementById(`feedback-${q.id}`);
                const statusEl = document.getElementById(`status-${q.id}`);
                const cardEl = document.getElementById(`question-card-${q.id}`);
                
                if (feedbackEl) feedbackEl.classList.remove('hidden');

                if (isCorrect) {
                    correctCount++;
                    if (statusEl) statusEl.innerHTML = `<span class="correct-ans">Đúng</span>`;
                    if (cardEl) {
                        cardEl.classList.add('bg-emerald-50', 'border-emerald-200');
                        cardEl.classList.remove('bg-white');
                    }
                } else {
                    wrongQuestions.push(q.id);
                    if (statusEl) statusEl.innerHTML = `<span class="wrong-ans">Sai</span>`;
                    if (cardEl) {
                        cardEl.classList.add('bg-red-50', 'border-red-200');
                        cardEl.classList.remove('bg-white');
                    }
                }
            });

            showResults(studentName, correctCount, wrongQuestions);
        }

        function showResults(name, correct, wrongs) {
            const score = ((correct / 50) * 10).toFixed(1);

            const nameEl = document.getElementById('student-name');
            if (nameEl) nameEl.disabled = true;
            document.querySelectorAll('input').forEach(i => i.disabled = true);
            
            const submitBtn = document.getElementById('submit-btn');
            const retryBtn = document.getElementById('retry-btn');
            const scoreDisplay = document.getElementById('score-display');
            const resultModal = document.getElementById('result-modal');

            if (submitBtn) submitBtn.classList.add('hidden');
            if (retryBtn) retryBtn.classList.remove('hidden');
            if (scoreDisplay) scoreDisplay.classList.remove('hidden');
            
            const finalScoreText = document.getElementById('final-score-text');
            if (finalScoreText) finalScoreText.innerText = `${score} / 10`;

            const modalName = document.getElementById('modal-name');
            const modalScore = document.getElementById('modal-score');
            const modalCorrect = document.getElementById('modal-correct');
            const modalWrong = document.getElementById('modal-wrong');
            const listEl = document.getElementById('modal-wrong-list');

            if (modalName) modalName.innerText = `Học sinh: ${name || 'Học sinh'}`;
            if (modalScore) modalScore.innerText = `${score} / 10`;
            if (modalCorrect) modalCorrect.innerText = correct;
            if (modalWrong) modalWrong.innerText = wrongs.length;
            
            if (listEl) {
                if (wrongs.length === 0) {
                    listEl.innerHTML = "<span class='text-emerald-600 font-bold'>Xuất sắc! Không sai câu nào.</span>";
                } else {
                    listEl.innerText = wrongs.map(id => `Câu ${id}`).join(', ');
                }
            }

            if (resultModal) resultModal.classList.remove('hidden');
        }

        function restoreSubmittedUI() {
            let correct = 0;
            let wrongs = [];
            questionsData.forEach(q => {
                let isCorrect = false;
                if (q.type === 'mcq') {
                    const checked = document.querySelector(`input[name="q${q.id}"]:checked`);
                    if (checked && checked.value === q.ans) isCorrect = true;
                } else {
                    const inputEl = document.getElementById(`q${q.id}`);
                    const val = inputEl ? inputEl.value : "";
                    if (cleanText(val) === cleanText(q.ans)) isCorrect = true;
                }
                if (isCorrect) correct++; else wrongs.push(q.id);
                
                const feedbackEl = document.getElementById(`feedback-${q.id}`);
                const statusEl = document.getElementById(`status-${q.id}`);
                const cardEl = document.getElementById(`question-card-${q.id}`);
                
                if (feedbackEl) feedbackEl.classList.remove('hidden');
                
                if (isCorrect) {
                    if (statusEl) statusEl.innerHTML = `<span class="correct-ans">Đúng</span>`;
                    if (cardEl) {
                        cardEl.classList.add('bg-emerald-50', 'border-emerald-200');
                        cardEl.classList.remove('bg-white');
                    }
                } else {
                    if (statusEl) statusEl.innerHTML = `<span class="wrong-ans">Sai</span>`;
                    if (cardEl) {
                        cardEl.classList.add('bg-red-50', 'border-red-200');
                        cardEl.classList.remove('bg-white');
                    }
                }
            });

            const nameEl = document.getElementById('student-name');
            if (nameEl) nameEl.disabled = true;
            document.querySelectorAll('input').forEach(i => i.disabled = true);
            
            const submitBtn = document.getElementById('submit-btn');
            const retryBtn = document.getElementById('retry-btn');
            const scoreDisplay = document.getElementById('score-display');

            if (submitBtn) submitBtn.classList.add('hidden');
            if (retryBtn) retryBtn.classList.remove('hidden');
            
            const score = ((correct / 50) * 10).toFixed(1);
            if (scoreDisplay) scoreDisplay.classList.remove('hidden');
            
            const finalScoreText = document.getElementById('final-score-text');
            if (finalScoreText) finalScoreText.innerText = `${score} / 10`;
            
            updateTimerUI();
        }

        function closeModal() {
            const resultModal = document.getElementById('result-modal');
            if (resultModal) resultModal.classList.add('hidden');
        }

        function retryExam() {
            if (confirm("Xóa toàn bộ bài làm để bắt đầu lại từ đầu?")) {
                try {
                    localStorage.removeItem(STORAGE_KEY);
                } catch(e) {}
                location.reload();
            }
        }
    </script>
</body>
</html>
